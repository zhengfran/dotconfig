# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Pin the in-browser directory picker. The shipped `directory-picker-auto`
# picks the native macOS chooser when dsh is launched locally on a loopback
# bind, but this Mac is used from other machines through
# `ssh -L 3080:127.0.0.1:3080`, where that chooser opens on the Mac's own
# (unattended) screen and new sessions can never get a workspace.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: directory-picker-browse-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
