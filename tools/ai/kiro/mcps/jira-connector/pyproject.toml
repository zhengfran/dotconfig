[project]
name = "jira-mcp-server"
version = "0.1.0"
description = "MCP server for Jira Data Center integration"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "responses>=0.23.0",
]

[tool.hypothesis]
max_examples = 100

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
