id = "zzc.balance"
name = "Balance panes"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Equalize pane widths/heights in a tab after a split (tmux even-layout / vim C-w =)"
platforms = ["linux", "macos"]

[[events]]
on = "pane.created"
command = ["python3", "balance.py"]

[[events]]
on = "pane.closed"
command = ["python3", "balance.py"]

# No rebalance, these only refresh the pane -> tab cache the close hook reads.
[[events]]
on = "pane.moved"
command = ["python3", "balance.py"]

[[startup]]
command = ["python3", "balance.py"]

# Manual trigger, bound to prefix+= in config.toml.
[[actions]]
id = "balance"
title = "Balance panes in tab"
contexts = ["workspace"]
command = ["python3", "balance.py"]
