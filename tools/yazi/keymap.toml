#:schema https://yazi-rs.github.io/schemas/keymap.json

# Only additions to yazi's built-in keymap live here; prepended bindings win
# over the preset ones on the same keys. The first binding whose first key
# matches wins, so a single-key "x" here hides every "x …" chord after it.

[mgr]
prepend_keymap = [
	{ on = [ "g", "p" ], run = "cd ~/Projects/",                  desc = "Goto ~/projects/" },
	{ on = "<C-g>",      run = "shell --confirm --block lazygit", desc = "Lazygit" },
	{ on = "S",          run = 'shell "$SHELL" --block --confirm', desc = "Open $SHELL here" },
	{ on = [ "m", "s" ], run = "plugin yamb save",                desc = "Add bookmark" },
	{ on = [ "m", "m" ], run = "plugin yamb jump_by_fzf",         desc = "Jump bookmark by fzf" },
	{ on = [ "m", "d" ], run = "plugin yamb delete_by_key",       desc = "Delete bookmark by key" },
	{ on = [ "c", "a" ], run = "plugin compress",                 desc = "Archive selected files" },
	{ on = "M",          run = "plugin relative-motions",         desc = "Trigger a new relative motion" },
]
