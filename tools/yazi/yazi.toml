#:schema https://yazi-rs.github.io/schemas/yazi.json

# Only overrides of yazi's built-in preset live here; everything else uses the
# defaults, so upstream renames don't break this file.

[mgr]
ratio       = [ 2, 2, 4 ]
show_hidden = true

[preview]
max_width = 1600

[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "$EDITOR",      for = "unix", block = true },
	{ run = "code %s",          desc = "code",         for = "windows", orphan = true },
	{ run = "nvim %s",          desc = "nvim",         for = "windows", orphan = true },
	{ run = "code -w %s",       desc = "code (block)", for = "windows", block = true },
	{ run = "nvim -w %s",       desc = "nvim (block)", for = "windows", block = true },
]
play = [
	{ run = "mpv --force-window %s", for = "unix", orphan = true },
	{ run = "mpv --force-window %s", for = "windows", orphan = true },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]
